<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUGVEDU 🫀</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }

body {
    background: linear-gradient(135deg, #021024, #052659, #5483B3);
    color: white;
    text-align: center;
    overflow-x: hidden;
    min-height: 100vh;
}

.page {
    min-height: 100vh;
    display: none;
    padding: 40px 20px;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

.active { display: flex; }

h1 {
    font-size: 42px;
    text-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
    margin-bottom: 20px;
}

.btn {
    padding: 15px 30px;
    border: none;
    border-radius: 30px;
    font-size: 18px;
    cursor: pointer;
    margin-top: 20px;
    background-color: #ffffff;
    color: #052659;
    font-weight: bold;
    transition: transform 0.2s, background-color 0.2s;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

.btn:hover {
    transform: scale(1.05);
    background-color: #f0f0f0;
}

.gallery {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 15px;
    max-width: 1000px;
    margin: 20px auto;
}

.gallery img {
    width: 220px;
    height: 220px;
    object-fit: cover;
    border-radius: 20px;
    box-shadow: 0 0 20px rgba(255,255,255,.3);
    animation: float 3s ease-in-out infinite;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

#loveGame {
    position: relative;
    height: 250px;
    width: 100%;
    max-width: 400px;
    margin: 20px auto;
}

#noBtn {
    position: absolute;
    left: 60%;
    top: 20px;
    transition: all 0.2s ease;
}

#yesBtn {
    position: absolute;
    left: 20%;
    top: 20px;
}

audio {
    width: 300px;
    max-width: 90%;
    margin-top: 20px;
}

.heart {
    position: fixed;
    top: -20px;
    font-size: 20px;
    pointer-events: none;
    animation: fall 5s linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(105vh) rotate(360deg);
    }
}
</style>
</head>
<body>

<div id="page1" class="page active">
    <h1>RUGVEDU 🫀</h1>
    <p>The prettiest girl ever ❤️</p>
    <button class="btn" onclick="showPage(2)">Enter 🌷</button>
</div>

<div id="page2" class="page">
    <h1>Beautiful Memories 📸</h1>
    <div class="gallery">
        <!-- Replace src with your real paths -->
        <img src="cover.jpg" alt="Cover">
        <img src="photo1.jpg" alt="Memory 1">
        <img src="photo2.jpg" alt="Memory 2">
        <img src="photo3.jpg" alt="Memory 3">
        <img src="childhood.jpg" alt="Childhood">
    </div>
    <button class="btn" onclick="showPage(3)">Next ❤️</button>
</div>

<div id="page3" class="page">
    <h1>Do You Love Me? 😂</h1>
    <div id="loveGame">
        <button class="btn" id="yesBtn" onclick="yesLove()">YES ❤️</button>
        <button class="btn" id="noBtn">NO 😒</button>
    </div>
    <button class="btn" onclick="showPage(4)" style="margin-top: 100px;">Skip 😭</button>
</div>

<div id="page4" class="page">
    <h1>Wanna Be Yours 🎵</h1>
    <audio controls>
        <source src="song.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    <p style="margin-top:25px; font-size:20px">You'll always be special 🌷🖤</p>
    <button class="btn" onclick="showPage(5)">Final ❤️</button>
</div>

<div id="page5" class="page">
    <h1>For RUGVEDU ❤️</h1>
    <p style="max-width:600px; line-height:1.8; font-size: 18px; margin-top: 20px;">
        No matter where life takes us, you'll always have a special place in my heart. 
        Thank you for all the smiles, memories and happiness. 🌷✨
    </p>
    <h2 style="margin-top:30px">Forever? ❤️</h2>
</div>

<script>
function showPage(num){
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    const targetPage = document.getElementById('page'+num);
    if(targetPage) {
        targetPage.classList.add('active');
        window.scrollTo(0,0);
    }
}

function yesLove(){
    alert("YAYYYY ❤️😭");
    showPage(4); // Automatically takes her to the song page on agreement!
}

const noBtn = document.getElementById('noBtn');
const loveGame = document.getElementById('loveGame');

function moveNoButton() {
    // Keeps calculation bounded cleanly inside the parent game box element container boundaries
    const maxX = loveGame.clientWidth - noBtn.clientWidth;
    const maxY = loveGame.clientHeight - noBtn.clientHeight;
    
    const randomX = Math.max(0, Math.floor(Math.random() * maxX));
    const randomY = Math.max(0, Math.floor(Math.random() * maxY));
    
    noBtn.style.left = randomX + 'px';
    noBtn.style.top = randomY + 'px';
}

// Fixed for Desktop & Mobile responsiveness 
noBtn.addEventListener('mouseover', moveNoButton);
noBtn.addEventListener('touchstart', (e) => {
    e.preventDefault(); // Prevents clicking on mobile touch devices
    moveNoButton();
});

// Optimized memory handling for floating background decorations
setInterval(() => {
    if (document.hidden) return; // Pauses tab engine overhead if backgrounded
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    // Varied sizing for depth illusion layout
    heart.style.transform = `scale(${Math.random() * 0.6 + 0.6})`; 
    
    document.body.appendChild(heart);
    
    // Explicit clean animation tracking
    heart.addEventListener('animationend', () => {
        heart.remove();
    });
}, 600);
</script>

</body>
</html>
