<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUGVEDU 🫀</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}

body{
background:linear-gradient(135deg,#021024,#052659,#5483B3);
color:white;
text-align:center;
overflow-x:hidden;
}

.page{
min-height:100vh;
display:none;
padding:30px 20px;
justify-content:center;
align-items:center;
flex-direction:column;
}

.active{display:flex;}

h1{
font-size:42px;
text-shadow:0 0 20px #fff;
margin-bottom:20px;
}

.btn{
padding:15px 30px;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
margin-top:20px;
}

.gallery img{
width:260px;
max-width:90%;
border-radius:20px;
margin:15px;
box-shadow:0 0 20px rgba(255,255,255,.4);
animation:float 3s ease-in-out infinite;
}

@keyframes float{
50%{transform:translateY(-10px);}
}

#loveGame{
position:relative;
height:300px;
width:100%;
}

#noBtn{
position:absolute;
}

audio{
width:300px;
max-width:90%;
margin-top:20px;
}

.heart{
position:fixed;
top:-20px;
font-size:20px;
animation:fall 5s linear infinite;
}

@keyframes fall{
to{
transform:translateY(110vh);
}
}
</style>
</head>

<body>

<div id="page1" class="page active">
<h1>RUGVEDU 🫀</h1>
<p>The prettiest girl ever ❤️</p>
<button class="btn" onclick="showPage(2)">Enter 🌷</button>
</div>

<div id="page2" class="page">
<h1>Beautiful Memories 📸</h1>

<div class="gallery">
<img src="cover.jpg">
<img src="photo1.jpg">
<img src="photo2.jpg">
<img src="photo3.jpg">
<img src="childhood.jpg">
</div>

<button class="btn" onclick="showPage(3)">Next ❤️</button>
</div>

<div id="page3" class="page">
<h1>Do You Love Me? 😂</h1>

<div id="loveGame">
<button class="btn" onclick="yesLove()">YES ❤️</button>
<button class="btn" id="noBtn">NO 😒</button>
</div>

<button class="btn" onclick="showPage(4)">Skip 😭</button>
</div>

<div id="page4" class="page">
<h1>Wanna Be Yours 🎵</h1>

<audio controls>
<source src="song.mp3" type="audio/mpeg">
</audio>

<p style="margin-top:25px;font-size:20px">
You'll always be special 🌷🖤
</p>

<button class="btn" onclick="showPage(5)">Final ❤️</button>
</div>

<div id="page5" class="page">
<h1>For RUGVEDU ❤️</h1>

<p style="max-width:600px;line-height:1.8">
No matter where life takes us,
you'll always have a special place in my heart.
Thank you for all the smiles,
memories and happiness. 🌷✨
</p>

<h2 style="margin-top:30px">
Forever? ❤️
</h2>
</div>

<script>

function showPage(num){
document.querySelectorAll('.page')
.forEach(p=>p.classList.remove('active'));

document.getElementById('page'+num)
.classList.add('active');
}

function yesLove(){
alert("YAYYYY ❤️😭");
}

const noBtn=document.getElementById('noBtn');

noBtn.addEventListener('mouseover',()=>{
let x=Math.random()*250;
let y=Math.random()*180;

noBtn.style.left=x+'px';
noBtn.style.top=y+'px';
});

setInterval(()=>{
let heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},5000);

},500);

</script>

</body>
</html>
